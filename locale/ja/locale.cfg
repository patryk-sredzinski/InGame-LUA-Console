[mod-name]
ingame-lua-console=InGame LUA Console

[mod-description]
ingame-lua-console=手動の構文プレビューとプレイヤーごとの保存スクリプトを備えた Lua コンソール。

[controls]
ilc-toggle=InGame LUA Console の切り替え
ilc-execute=現在の Lua コンソールスクリプトを実行

[ilc]
io-button=インポート / エクスポート
io-title=スクリプトのインポート / エクスポート
io-help=エクスポート: 下のテキストをコピー（Ctrl+C）。インポート: 以前のエクスポートを貼り付けて「インポート」をクリック。
import=インポート
import-invalid=このテキストは有効なスクリプトのエクスポートではありません。
imported=[Lua Console] __1__ 個のスクリプトをインポートしました。
import-skipped=[Lua Console] __1__ 個のスクリプトをスキップしました（大きすぎる、またはインポート上限に達しました）。
preview-truncated=[color=#888888]… プレビューを省略（__1__ 行中、先頭 __2__ 行を表示）[/color]
command-help=Lua コンソールを開く、または閉じます。
title=InGame LUA Console
open-tooltip=Lua コンソールを開く（__CONTROL__ilc-toggle__）
close=閉じる
minimize=最小化
maximize=最大化
saved-scripts=保存済みスクリプト
no-scripts=保存済みスクリプトはまだありません。
no-matching-scripts=検索に一致するスクリプトがありません。
search-placeholder=スクリプトを検索…
new=新規
new-tooltip=新しい空のスクリプトを開始
execute=実行
execute-tooltip=エディターのコードを実行
hotkey-execute=ホットキー
hotkey-execute-tooltip=オンのとき、コンソールが閉じていても __CONTROL__ilc-execute__ が現在のスクリプトを実行します。エディター入力中は Factorio がショートカットをブロックします — 先に外側をクリック / プレビューするか、コンソールを閉じてください。
validate=検証
validate-tooltip=コードを実行せずに Lua 構文を確認
validate-ok=[Lua Console] 構文 OK
nothing-to-validate=検証する前にコードを書いてください。
preview=プレビュー
preview-tooltip=構文色付きプレビューを表示
edit=編集
edit-tooltip=編集に戻る
save=保存
delete-tooltip=このスクリプトを削除
delete=削除
cancel=キャンセル
confirm-title=スクリプトを削除
confirm-delete=スクリプト「__1__」を削除しますか？この操作は取り消せません。
save-title=スクリプトを保存
title-label=タイトル
icon-label=アイコン
nothing-to-save=保存する前にコードを書いてください。
admin-only=コードを実行できるのは管理者のみです。
error-title=Lua エラー
copy=コピー
copy-tooltip=エラー文を選択します — Ctrl+C でコピー
