[mod-name]
ingame-lua-console=InGame LUA Console

[mod-description]
ingame-lua-console=带手动语法预览和按玩家保存脚本的 Lua 控制台。

[controls]
ilc-toggle=切换 InGame LUA Console
ilc-execute=执行当前 Lua 控制台脚本

[ilc]
io-button=导入 / 导出
io-title=导入 / 导出脚本
io-help=导出：复制下方文本（Ctrl+C）。导入：粘贴之前导出的文本并点击导入。
import=导入
import-invalid=该文本不是有效的脚本导出内容。
imported=[Lua Console] 已导入 __1__ 个脚本。
import-skipped=[Lua Console] 已跳过 __1__ 个脚本（过大或达到导入上限）。
preview-truncated=[color=#888888]… 预览已截断（共 __1__ 行，显示前 __2__ 行）[/color]
command-help=打开或关闭 Lua 控制台。
title=InGame LUA Console
open-tooltip=打开 Lua 控制台（__CONTROL__ilc-toggle__）
close=关闭
minimize=最小化
maximize=最大化
saved-scripts=已保存脚本
no-scripts=尚无已保存的脚本。
no-matching-scripts=没有匹配搜索的脚本。
search-placeholder=搜索脚本…
new=新建
new-tooltip=开始一个新的空脚本
execute=执行
execute-tooltip=运行编辑器中的代码
hotkey-execute=快捷键
hotkey-execute-tooltip=勾选后，即使控制台已关闭，__CONTROL__ilc-execute__ 也会运行当前脚本。在编辑器中输入时 Factorio 会屏蔽快捷键——请先点击外部 / 预览，或关闭控制台。
validate=校验
validate-tooltip=检查 Lua 语法而不运行代码
validate-ok=[Lua Console] 语法正确
nothing-to-validate=请先编写代码再校验。
preview=预览
preview-tooltip=显示语法高亮预览
edit=编辑
edit-tooltip=切换回编辑
save=保存
delete-tooltip=删除此脚本
delete=删除
cancel=取消
confirm-title=删除脚本
confirm-delete=删除脚本“__1__”？此操作无法撤销。
save-title=保存脚本
title-label=标题
icon-label=图标
nothing-to-save=请先编写代码再保存。
admin-only=仅管理员可以执行代码。
error-title=Lua 错误
copy=复制
copy-tooltip=选中错误文本 — 按 Ctrl+C 复制
