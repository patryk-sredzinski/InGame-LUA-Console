io-button=Import / Export
io-title=Import / Export scripts
io-help=Export: copy the text below (Ctrl+C). Import: paste previously exported text and click Import.
import=Import
import-invalid=That text is not a valid scripts export.
imported=[Lua Console] Imported __1__ script(s).
import-skipped=[Lua Console] Skipped __1__ script(s) (too large or import limit reached).
preview-truncated=[color=#888888]… preview truncated (__1__ lines, showing first __2__)[/color]
command-help=Open or close the Lua console.
title=InGame LUA Console
open-tooltip=Open the Lua console (__CONTROL__ilc-toggle__)
close=Close
minimize=Minimize
maximize=Maximize
saved-scripts=Saved scripts
no-scripts=No saved scripts yet.
no-matching-scripts=No scripts match the search.
search-placeholder=Search scripts…
new=New
new-tooltip=Start a new, empty script
execute=Execute
