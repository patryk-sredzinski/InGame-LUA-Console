[mod-name]
ingame-lua-console=InGame LUA Console

[mod-description]
ingame-lua-console=A Lua console with manual syntax preview and per-player saved scripts.

[controls]
ilc-toggle=Toggle InGame LUA Console
ilc-execute=Execute current Lua console script

